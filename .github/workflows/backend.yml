name: Backend (Node)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  backend:
    name: Backend — install, syntax check & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches backend/Dockerfile (node:22-bookworm-slim) and the
          # `engines` floor, so the better-sqlite3 native module is built for
          # the runtime it actually ships on.
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/index.js

      # node:test only — the suite mocks Soroban RPC and uses temp/in-memory
      # SQLite, so it needs no services or network access.
      - name: Test
        run: npm test
