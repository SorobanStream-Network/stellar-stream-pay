name: Frontend (Vite)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  frontend:
    name: Frontend — tests, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vitest covers the accrual/formatting helpers — the pure logic the UI
      # depends on, so a regression there fails the build instead of shipping.
      - name: Test
        run: npm test

      # `npm run build` runs `tsc -b && vite build`: a full typecheck plus a
      # production bundle. Env vars are optional — src/config.ts falls back to
      # Testnet defaults.
      - name: Build
        run: npm run build
