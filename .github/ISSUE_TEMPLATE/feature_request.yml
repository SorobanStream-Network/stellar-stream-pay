name: Feature request
description: A user-facing or product capability
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome, not the implementation. The team will scope it
        into a task issue when it's ready to build.
  - type: input
    id: problem
    attributes:
      label: User problem
      description: What a user (or judge) cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: The observable behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Options already evaluated (including "do nothing").
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How we'd know this shipped correctly (measurable where possible).
    validations:
      required: true
