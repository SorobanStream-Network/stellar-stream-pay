# StellarStream-Pay — Soroban contracts workspace.
#
# `core/` holds the frozen stream-core primitive; future extension contracts
# (splits, schedules, payroll, tokenized positions) live alongside it as
# separate workspace members that *compose* the core rather than extending it.

[workspace]
resolver = "2"
members = ["core"]

# Optimize for the smallest possible Wasm binary while keeping overflow
# checks enabled (arithmetic overflow traps the transaction instead of
# silently wrapping — a critical safety property for a payment contract).
# These settings apply to every workspace member.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
